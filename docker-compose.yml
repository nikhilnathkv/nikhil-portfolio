# Local development stack: `docker compose up`
#   web       -> http://localhost:3000
#   api       -> http://localhost:8000  (docs at /docs)
#   postgres  -> localhost:5432
#   storage   -> http://localhost:9000  (MinIO console at :9001)
#
# Configuration is read from the root `.env` file (copy from `.env.example`).

name: nikhil-portfolio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-portfolio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-portfolio123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ensure the API talks to the compose services regardless of .env host values.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}
      # Reach MinIO over the compose network; browsers still load assets via the public URL.
      MINIO_ENDPOINT: storage:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']
    volumes:
      # Mount source for hot-reload without shadowing the image's virtualenv.
      - ./apps/api/app:/app/app
      - ./apps/api/migrations:/app/migrations
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000/api/v1}
      # Public origin browsers load uploaded media from (also whitelisted in the CSP).
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:-http://localhost:9000}
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  storage_data:
